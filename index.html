<html lang="fr">
<head>
    <title>Aventure</title>
    <style>
        body { background-color: black;text-align: center; }
        h1 { color:white; }
    </style>
</head>
<body onload="onload();">
    <h1>Aventure</h1>
    <canvas id="jeuCanvas"></canvas>
</body>
<script>
    let jeu = null;

    function rgbToHex(r, g, b) {
        return "" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function onload() {
        let images = {
            "s_chambre": null,
            "s_chambre.masque": null,
            "s_salon": null,
            "s_salon.masque": null
        };

        // charge les images
        loadImages(images, function() {
            let jeuCanvas = document.getElementById('jeuCanvas');

            // redimensionne le canvas
            jeuCanvas.width = 640;
            jeuCanvas.height = 560;

            const Jeu = function(jeuCanvas) {
                let that = this;
                this._jeuCanvas = jeuCanvas;
                this._scenes = {};
                this._scene = null;
                this._texte = null;
                this._choix = null;
                this._model = {
                    "navigateur": false,
                        "chambre": {
                        "mail": false
                    }
                };

                // créé le masque
                this._masqueCanvas = document.createElement("canvas");
                this._masqueCanvas.width = this._jeuCanvas.width;
                this._masqueCanvas.height = this._jeuCanvas.height;

                // récupère les contextes
                this._jeuCtx = this._jeuCanvas.getContext('2d');
                this._jeuCtx.font = '18px serif';
                this._masqueCtx = this._masqueCanvas.getContext('2d');

                that._jeuCanvas.addEventListener("mousemove", function(e) {
                    let mouseX, mouseY;
                    mouseX = e.offsetX;
                    mouseY = e.offsetY;
                    if(that._texte != null) {
                        return;
                    }
                    if(that._choix != null) {
                        if(mouseY > 540 && mouseY <= 560 && that._choix.cb4) {
                            that._jeuCanvas.style.cursor = "pointer";
                        } else if(mouseY > 520 && mouseY <= 540 && that._choix.cb3) {
                            that._jeuCanvas.style.cursor = "pointer";
                        } else if(mouseY > 500 && mouseY <= 520 && that._choix.cb2) {
                            that._jeuCanvas.style.cursor = "pointer";
                        } else if(mouseY > 480 && mouseY <= 500 && that._choix.cb1) {
                            that._jeuCanvas.style.cursor = "pointer";
                        } else {
                            that._jeuCanvas.style.cursor = "default";
                        }
                        return;
                    }
                    let r = that._masque[(mouseY * 2560 + mouseX * 4)];
                    let v = that._masque[(mouseY * 2560 + mouseX * 4) + 1];
                    let b = that._masque[(mouseY * 2560 + mouseX * 4) + 2];
                    let color = rgbToHex(r, v, b);
                    if(color === "ffffff") {
                        that._jeuCanvas.style.cursor = "default";
                        return;
                    }
                    let action = that._scene["actions"][color];
                    if(action == null) {
                        return;
                    }
                    that._jeuCanvas.style.cursor = action.curseur;
                }, false);
                that._jeuCanvas.addEventListener("click", function(e) {
                    let mouseX, mouseY;
                    mouseX = e.offsetX;
                    mouseY = e.offsetY;
                    if(that._texte != null) {
                        if(that._texte.cb != null) {
                            that._texte.cb();
                        } else {
                            // callback par défaut : masquer texte
                            that.afficheInventaire();
                        }
                        return;
                    }
                    if(that._choix != null) {
                        if(mouseY > 540 && mouseY <= 560 && that._choix.cb4) {
                            that._choix.cb4();
                        } else if(mouseY > 520 && mouseY <= 540 && that._choix.cb3) {
                            that._choix.cb3();
                        } else if(mouseY > 500 && mouseY <= 520 && that._choix.cb2) {
                            that._choix.cb2();
                        } else if(mouseY > 480 && mouseY <= 500 && that._choix.cb1) {
                            that._choix.cb1();
                        }
                        return;
                    }
                    let r = that._masque[(mouseY * 2560 + mouseX * 4)];
                    let v = that._masque[(mouseY * 2560 + mouseX * 4) + 1];
                    let b = that._masque[(mouseY * 2560 + mouseX * 4) + 2];
                    let color = rgbToHex(r, v, b);
                    if(color === "ffffff") {
                        return;
                    }
                    let action = that._scene["actions"][color];
                    if(action == null) {
                        return;
                    }
                    action.action(that);
                }, false);
            };
            Jeu.prototype.afficheInventaire = function() {
                this._jeuCtx.fillStyle = "white";
                this._jeuCtx.fillRect(0, 481, 640, 79);
                this._texte = null;
                this._jeuCtx.fillStyle = "black";
                // TODO
                this._jeuCtx.fillText("inventaire", 10, 495);
            };
            Jeu.prototype.afficheTexte = function(texte1, texte2, texte3, texte4, cb) {
                this._jeuCtx.fillStyle = "white";
                this._jeuCtx.fillRect(0, 481, 640, 79);
                this._jeuCtx.fillStyle = "black";
                this._jeuCtx.fillText(texte1, 10, 495);
                if(texte2) {
                    this._jeuCtx.fillText(texte2, 10, 515);
                }
                if(texte3) {
                    this._jeuCtx.fillText(texte3, 10, 535);
                }
                if(texte4) {
                    this._jeuCtx.fillText(texte4, 10, 555);
                }
                this._texte = {"cb":cb};
                jeuCanvas.style.cursor = "default";
                this._jeuCtx.fillStyle = "gray";
                this._jeuCtx.fillText("(cliquer pour continuer)", 460, 555);
            };
            Jeu.prototype.afficheChoix = function(texte1, cb1, texte2, cb2, texte3, cb3, texte4, cb4) {
                this._jeuCtx.fillStyle = "white";
                this._jeuCtx.fillRect(0, 481, 640, 79);
                this._jeuCtx.fillStyle = "black";
                this._jeuCtx.strokeStyle = "black";
                this._jeuCtx.fillText("> " + texte1, 10, 495);
                if(texte2) {
                    this._jeuCtx.fillText("> " + texte2, 10, 515);
                }
                if(texte3) {
                    this._jeuCtx.fillText("> " + texte3, 10, 535);
                }
                if(texte4) {
                    this._jeuCtx.fillText("> " + texte4, 10, 555);
                }
                this._choix = {"cb1":cb1, "cb2":cb2, "cb3":cb3, "cb4":cb4};
                jeuCanvas.style.cursor = "default";
            };
            Jeu.prototype.termineChoix = function() {
                this._choix = null;
                this._afficheScene();
            };
            Jeu.prototype.afficheScene = function(sceneNom) {
                this._choix = null;
                this._scene = this._scenes[sceneNom];
                this._afficheScene();
            };
            Jeu.prototype._afficheScene = function() {
                this.afficheInventaire();
                this._jeuCtx.drawImage(this._scene.fond, 0, 0)
                this._masqueCtx.drawImage(this._scene.masque, 0, 0);
                this._masque = this._masqueCtx.getImageData(0, 0, 640, 480).data;
            };
            Jeu.prototype.addScene = function(scene) {
                this._scenes[scene.nom] = scene;
            };

            jeu = new Jeu(jeuCanvas);
            //*** chambre **********************************************************************************************
            jeu.addScene({
                "nom": "chambre",
                "fond": images["s_chambre"],
                "masque": images["s_chambre.masque"],
                "actions": {
                    "ff0000": {
                        "curseur": "zoom-in",
                        "action": function(jeu) {
                            jeu.afficheTexte("La fenêtre", null, null, null, function() {
                                jeu.afficheTexte("Je ne vois rien d'intéressant dehors.");
                            });
                        }
                    },
                    "00ff00": {
                        "curseur": "zoom-in",
                        "action": function(jeu) {
                            jeu.afficheChoix(
                                "Mail", function() {
                                    jeu.afficheChoix(
                                        "Lire le mail", function() {
                                            jeu.termineChoix();
                                        },
                                        "Écrire un mail", function() {
                                            jeu._model.chambre.mail = true;
                                            jeu.termineChoix();
                                        },
                                        "Non, rien...", function() {
                                            jeu.termineChoix();
                                        }
                                    );
                                },
                                "Navigateur web", function() {
                                    jeu._model.navigateur = true;
                                    jeu.termineChoix();
                                },
                                "Aller au salon", function() {
                                    jeu.afficheScene("salon");
                                },
                                "Non, rien...", function() {
                                    jeu.termineChoix();
                                });
                        }
                    },
                    "0000ff": {
                        "curseur": "grab",
                        "action": function(jeu) {
                            jeu.afficheTexte("Ça ne fait rien.", "Il manque peut-être quelque chose ?", "Je ne sais pas...");
                        }
                    }
                }
            });
            //*** salon ************************************************************************************************
            jeu.addScene({
                "nom": "salon",
                "fond": images["s_salon"],
                "masque": images["s_salon.masque"],
                "actions": {
                    "ff0000": {
                        "curseur": "pointer",
                        "action": function(jeu) {
                            jeu.afficheScene("chambre");
                        }
                    }
                }
            });
            jeu.afficheScene("chambre");
        })
    }

    function loadImages(images, cb) {
        let count = 0;
        let imageLoaded = function() {
            count--;
            if(count === 0) {
                cb();
            }
        };
        for(let image in images) {
            if(!images.hasOwnProperty(image)) {
                continue;
            }
            count++;
            let i = new Image();
            i.addEventListener("load", imageLoaded, false);
            i.src = image + ".png";
            i.setAttribute("crossOrigin", "");
            images[image] = i;
        }
    }
</script>
</html>
