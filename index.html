<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <title>Une aventure d'Heurace : le robot de combat</title>
    <style>
        body { background-color: black;text-align: center; }
        h1 { color:white; }
    </style>
    <script src="Jeu.js" charset="utf-8"></script>
    <script src="Chambre.js" charset="utf-8"></script>
    <script src="Salon.js" charset="utf-8"></script>
</head>
<body onload="onload();">
    <h1>Une aventure d'Heurace : le robot de combat</h1>
    <canvas id="jeuCanvas"></canvas>
</body>
<script>
    let jeu = null;

    function onload() {
        let images = {
            "curseur_seea": null,
            "curseur_usea": null,
            "chambre": null,
            "chambre_crayons": null,
            "chambre_terrarium": null,
            "chambre_livres": null,
            "chambre_porte": null,
            "chambre_cailloux": null,
            "chambre_tapis": null,
            "chambre_poster": null,
            "chambre_fenetre": null,
            "chambre_lit": null,
            "chambre_tiroirlit": null,
            "chambre_ordinateur": null,
            "chambre_bazaravec": null,
            "chambre_bazarsans": null,
            "salon": null,
            "salon_porteatelier": null,
            "salon_portechambre": null,
            "salon_portecuisine": null
        };

        // charge les images
        loadImages(images, function() {
            let jeuCanvas = document.getElementById('jeuCanvas');

            // redimensionne le canvas
            jeuCanvas.width = 640;
            jeuCanvas.height = 560;

            jeu = new Jeu(jeuCanvas, images);
            jeu.addScene(new Chambre(images));
            jeu.addScene(new Salon(images));
            jeu.scene("chambre");
        })
    }

    function loadImages(images, cb) {
        let count = 0;
        let imageLoaded = function() {
            count--;
            if(count === 0) {
                cb();
            }
        };
        for(let image in images) {
            if(!images.hasOwnProperty(image)) {
                continue;
            }
            count++;
            let i = new Image();
            i.addEventListener("load", imageLoaded, false);
            i.src = image + ".png";
            i.setAttribute("crossOrigin", "");
            images[image] = i;
        }
    }
</script>
</html>
